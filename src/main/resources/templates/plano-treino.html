<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plano de Treino - PlanoSaude</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">PlanoSaude</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/calendario}">Calendário</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" th:href="@{/plano-treino}">Plano de Treino</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/plano-dieta}">Plano de Dieta</a>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="nav-link btn btn-link">Sair</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Alerts -->
    <div class="container mt-3">
        <div th:if="${mensagem}" class="alert alert-success alert-dismissible fade show" role="alert">
            <span th:text="${mensagem}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${erro}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <span th:text="${erro}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container mt-5">
        <h1 class="mb-4">Plano de Treino</h1>

        <!-- Workout Plan Form -->
        <div class="card mb-4">
            <div class="card-header">
                <h2>Criar Novo Treino</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/plano-treino/salvar}" th:object="${treinoForm}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição do Treino</label>
                        <textarea id="descricao" th:field="*{descricao}" class="form-control" rows="4" required></textarea>
                        <div th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}" class="text-danger"></div>
                    </div>
                    <div class="mb-3">
                        <label for="data" class="form-label">Data e Hora</label>
                        <input type="datetime-local" id="data" th:field="*{data}" class="form-control" required />
                        <div th:if="${#fields.hasErrors('data')}" th:errors="*{data}" class="text-danger"></div>
                    </div>
                    <button type="submit" class="btn btn-primary">Salvar Treino</button>
                </form>
            </div>
        </div>

        <!-- Workout List -->
        <div class="card mb-4">
            <div class="card-header">
                <h2>Seus Treinos</h2>
            </div>
            <div class="card-body">
                <ul class="list-group">
                    <li th:each="plano : ${planos}" class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <strong th:text="${plano.nome}"></strong>
                            <p th:text="${plano.descricao}"></p>
                            <span th:text="'Início: ' + ${#temporals.format(plano.dataInicio, 'dd/MM/yyyy HH:mm')}"></span>
                        </div>
                        <div>
                            <a th:href="@{/plano-treino(id=${plano.id})}" class="btn btn-sm btn-primary"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/plano-treino/deletar/{id}(id=${plano.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('Deseja excluir este plano de treino?');"><i class="bi bi-trash"></i></button>
                            </form>
                        </div>
                    </li>
                    <li th:if="${#lists.isEmpty(planos)}" class="list-group-item">Nenhum treino cadastrado</li>
                </ul>
            </div>
        </div>
    </div>

    <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
